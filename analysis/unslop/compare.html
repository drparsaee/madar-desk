<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مدار | مقایسه قبل و بعد Unslop</title>
<style>
* { box-sizing:border-box }
body { margin:0; padding:24px; background:#14171e; color:#e9eff6; font-family:Tahoma,sans-serif }
h1 {font-size:22px; margin:0 0 10px}
p {color:#a9b8ca;font-size:13px;line-height:1.9}
section {margin:32px 0 40px}
h2 {font-size:16px;margin:0 0 14px}
.compare {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
figure {margin:0;padding:12px;border:1px solid #394150;border-radius:14px;background:#1e232c}
figcaption {font-size:13px;margin:0 0 10px}
img {display:block;width:100%;height:auto;border:1px solid #3d4555;border-radius:8px}
@media(max-width:820px){body{padding:12px}.compare{grid-template-columns:1fr}}
</style>
</head>
<body>
<h1>مدار | مقایسه بصری Unslop</h1>
<p>تمام تصاویر از رابط واقعی React با داده‌های مصنوعی آزمون گرفته شده‌اند. این تصاویر مربوط به نسخه نصب‌شده مشتری نیستند.</p>
<section><h2>تم تیره · ۱۴۴۰ پیکسل</h2><div class="compare">
<figure><figcaption>قبل</figcaption><img src="before-overview/dark.png" alt="داشبورد قبلی تم تیره"></figure>
<figure><figcaption>بعد</figcaption><img src="after-overview/dark.png" alt="داشبورد اصلاح شده تم تیره"></figure></div></section>
<section><h2>تم روشن · ۱۴۴۰ پیکسل</h2><div class="compare">
<figure><figcaption>قبل</figcaption><img src="before-overview/light.png" alt="داشبورد قبلی تم روشن"></figure>
<figure><figcaption>بعد</figcaption><img src="after-overview/light.png" alt="داشبورد اصلاح شده تم روشن"></figure></div></section>
<section><h2>موبایل · ۳۹۰ پیکسل</h2><div class="compare">
<figure><figcaption>قبل</figcaption><img src="before-overview/mobile.png" alt="داشبورد قبلی موبایل"></figure>
<figure><figcaption>بعد</figcaption><img src="after-overview/mobile.png" alt="داشبورد اصلاح شده موبایل"></figure></div></section>
</body></html>
